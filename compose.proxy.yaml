services:
  paper:
    ports: !reset []
  proxy:
    image: caddy:2.11.9@sha256:0c2243efcf437ab7f7a978f1027fcf0d4f9be8a75df27b1b3fbc5dbe0ffa8cf0
    restart: unless-stopped
    environment:
      PAPER_DOMAIN: ${PAPER_DOMAIN:?Set your reader hostname}
      PAPER_AUTH_USER: ${PAPER_AUTH_USER:?Set a proxy username}
      PAPER_AUTH_PASSWORD_HASH: ${PAPER_AUTH_PASSWORD_HASH:?Generate a proxy password hash}
    ports:
      - ${PAPER_PROXY_BIND:-127.0.0.1}:80:80
      - ${PAPER_PROXY_BIND:-127.0.0.1}:443:443
    volumes:
      - ./examples/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./proxy-data:/data
      - ./proxy-config:/config
