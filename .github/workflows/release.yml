name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run typecheck && npm test && npm run build && npm run test:smoke
      - run: npm run licenses && git diff --exit-code -- THIRD_PARTY_NOTICES.md licenses
      - name: Match tag to package version
        run: test "$GITHUB_REF_NAME" = "v$(node -p 'require("./package.json").version')"
  publish:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Image version
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          target: runtime
          load: true
          tags: paper-public:0.1.0-alpha.1
          build-args: SOURCE_REVISION=${{ github.sha }}
      - run: python3 scripts/test-installation.py
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          target: runtime
          push: true
          tags: ghcr.io/cliophate/paper-reader:${{ steps.version.outputs.value }}
          build-args: SOURCE_REVISION=${{ github.sha }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          target: ai
          push: true
          tags: ghcr.io/cliophate/paper-reader:${{ steps.version.outputs.value }}-ai
          build-args: SOURCE_REVISION=${{ github.sha }}
