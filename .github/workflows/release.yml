name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run typecheck && npm test && npm run build && npm run test:smoke
      - run: npm run licenses && git diff --exit-code -- THIRD_PARTY_NOTICES.md licenses
      - name: Match tag to package version
        run: test "$GITHUB_REF_NAME" = "v$(node -p 'require("./package.json").version')"
  publish:
    if: github.repository == 'cliophate/paper-reader'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Image version
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          target: runtime
          load: true
          tags: paper-public:test
          build-args: SOURCE_REVISION=${{ github.sha }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          target: ai
          load: true
          tags: paper-public:ai-test
          build-args: SOURCE_REVISION=${{ github.sha }}
      - run: docker run --rm --network none paper-public:ai-test codex --version
      - run: python3 scripts/test-installation.py
      - run: python3 scripts/test-ai-worker.py --real
      - name: Push verified images
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          docker tag paper-public:test "ghcr.io/cliophate/paper-reader:$RELEASE_VERSION"
          docker tag paper-public:ai-test "ghcr.io/cliophate/paper-reader:$RELEASE_VERSION-ai"
          docker push "ghcr.io/cliophate/paper-reader:$RELEASE_VERSION"
          docker push "ghcr.io/cliophate/paper-reader:$RELEASE_VERSION-ai"
      - name: Publish public release archive
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          archive="paper-reader-$RELEASE_VERSION-linux-amd64.tar.gz"
          docker tag paper-public:test "ghcr.io/cliophate/paper-reader:$RELEASE_VERSION"
          docker save "ghcr.io/cliophate/paper-reader:$RELEASE_VERSION" | gzip -1 > "$archive"
          sha256sum "$archive" > "$archive.sha256"
          gh release create "$GITHUB_REF_NAME" "$archive" "$archive.sha256" --verify-tag --prerelease --title "Paper $RELEASE_VERSION" --notes-file .github/alpha-release-notes.md
