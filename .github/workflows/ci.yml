name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:browser -- --trace=retain-on-failure
      - run: npm run build:server
      - run: npx playwright test --config playwright.routes.config.ts
      - name: Upload browser failure traces
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-failures-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
  application:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=moderate
      - run: python3 -m unittest discover -s scripts -p 'test_container_engine.py'
      - run: node scripts/audit-dev.mjs
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:smoke
      - run: npm run licenses && git diff --exit-code -- THIRD_PARTY_NOTICES.md licenses
      - name: Scan public source for secrets
        run: |
          mkdir -p "$RUNNER_TEMP/gitleaks"
          cd "$RUNNER_TEMP/gitleaks"
          # Plain downloads work on runners without the GitHub CLI.
          for file in gitleaks_8.30.1_linux_x64.tar.gz gitleaks_8.30.1_checksums.txt; do
            curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/$file"
          done
          sha256sum --check --ignore-missing gitleaks_8.30.1_checksums.txt
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/gitleaks/gitleaks" dir . --redact --no-banner
  image:
    needs: application
    # Image builds need a Docker daemon. Self-hosted runners may not provide one.
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runtime
          load: true
          tags: paper-public:test
          push: false
          build-args: SOURCE_REVISION=${{ github.sha }}
      - run: docker build --target ai -t paper-public:ai-test .
      - run: python3 scripts/test-installation.py
      - run: python3 scripts/test-miniflux-installation.py
        env:
          MINIFLUX_TEST_VERSION: "2.3.2"
      - run: python3 scripts/test-miniflux-installation.py
        env:
          MINIFLUX_TEST_VERSION: "2.3.3"
  ai-image:
    needs: application
    # Image builds need a Docker daemon. Self-hosted runners may not provide one.
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          target: ai
          load: true
          tags: paper-public:ai-test
          push: false
          build-args: SOURCE_REVISION=${{ github.sha }}
      - run: docker build --target runtime -t paper-public:test .
      - run: docker run --rm --network none paper-public:ai-test codex --version
      - run: python3 scripts/test-ai-worker.py --real
