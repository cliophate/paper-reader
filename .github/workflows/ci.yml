name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm audit --audit-level=moderate
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:smoke
      - run: npm run licenses && git diff --exit-code -- THIRD_PARTY_NOTICES.md licenses
      - name: Scan public source for secrets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/gitleaks"
          gh release download v8.30.1 --repo gitleaks/gitleaks --pattern 'gitleaks_8.30.1_linux_x64.tar.gz' --pattern 'gitleaks_8.30.1_checksums.txt' --dir "$RUNNER_TEMP/gitleaks"
          cd "$RUNNER_TEMP/gitleaks"
          sha256sum --check --ignore-missing gitleaks_8.30.1_checksums.txt
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/gitleaks/gitleaks" dir . --redact --no-banner
  image:
    needs: application
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runtime
          load: true
          tags: paper-public:test
          push: false
          build-args: SOURCE_REVISION=${{ github.sha }}
      - run: python3 scripts/test-installation.py
  ai-image:
    needs: application
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          target: ai
          load: true
          tags: paper-public:ai-test
          push: false
          build-args: SOURCE_REVISION=${{ github.sha }}
      - run: docker run --rm --network none paper-public:ai-test codex --version
      - run: docker run --rm --network none paper-public:ai-test opencode --version
